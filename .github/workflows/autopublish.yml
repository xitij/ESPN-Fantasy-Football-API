name: Autopublish
on:
  push:
    branches:
      - main

jobs:
  test:
    name: Publish NPM Package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 16
      - name: Install Dependencies
        run: npm ci
      - name: Publish
        uses: JS-DevTools/npm-publish@v4
        with:
          token: ${{ secrets.NPM_TOKEN }}
          access: public
          strategy: all
