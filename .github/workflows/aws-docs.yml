# Disabled for this fork: do not upload docs to AWS on push.
# Upstream used the original author's S3 bucket via AWS_* secrets.
# Re-enable with your own AWS secrets + `on.push.branches: [main]` if you host docs yourself.
name: Build and Upload Docs
on:
  workflow_dispatch:

jobs:
  build-and-upload-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - run: npm ci
      - run: npm run build:docs
      - uses: shallwefootball/s3-upload-action@master
        with:
          aws_key_id: ${{ secrets.AWS_KEY_ID }}
          aws_secret_access_key: ${{ secrets.AWS_SECRET_ACCESS_KEY}}
          aws_bucket: ${{ secrets.AWS_BUCKET }}
          source_dir: 'docs'
          destination_dir: ''
